buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

apply plugin: 'com.android.application'

// project 级依赖仓库：供 xposed api 依赖解析
repositories {
    google()
    mavenCentral()
    maven { url 'https://api.xposed.info/' }
}

android {
    namespace 'bin.mt.plus.hook'
    compileSdk 33

    defaultConfig {
        applicationId "bin.mt.plus.hook"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
